<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>ABD SERVICE — Actualités Bénin & Monde</title>
  <meta name="application-name" content="ABD SERVICE" />
  <meta name="description" content="Actualités en temps réel du Bénin et du monde" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ABD SERVICE" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;
      --gold:#c9a84c;--gold2:#f0d080;
      --red:#c0392b;--green:#27ae60;
      --text:#e8e8e8;--muted:#777;--border:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;padding-bottom:70px}
    .ticker-wrap{background:var(--red);overflow:hidden;white-space:nowrap;padding:7px 0}
    .ticker-inner{display:inline-block;animation:ticker 50s linear infinite;font-size:13px;color:#fff;padding-left:100%}
    @keyframes ticker{to{transform:translateX(-100%)}}
    header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .header-main{padding:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between}
    .logo{font-family:'Bebas Neue',serif;font-size:38px;color:var(--gold2);letter-spacing:2px;line-height:1}
    .logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;font-family:monospace;margin-top:2px}
    .date-badge{font-family:monospace;font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:4px 10px;border-radius:2px;letter-spacing:1px;margin-bottom:4px}
    .tabs{display:flex;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:1;min-width:75px;background:none;border:none;color:var(--muted);padding:11px 8px;font-size:11px;font-family:monospace;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
    .tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
    main{padding:16px;max-width:700px;margin:0 auto}
    .loading{text-align:center;padding:60px 20px;color:var(--muted)}
    .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-box{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);border-radius:8px;padding:20px;text-align:center;margin:20px 0}
    .error-box p{color:#e74c3c;margin-bottom:12px;font-size:15px}
    .retry-btn{background:var(--red);border:none;color:#fff;padding:10px 24px;border-radius:4px;font-size:14px;cursor:pointer;font-family:monospace}
    .sec-label{font-family:monospace;font-size:10px;letter-spacing:3px;color:var(--gold);border-bottom:1px solid rgba(201,168,76,.2);padding-bottom:8px;margin-bottom:16px}
    .top-story{display:block;margin-bottom:24px;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);text-decoration:none;color:inherit}
    .top-story:active{opacity:.8}
    .top-img{width:100%;height:180px;object-fit:cover;background:var(--bg3);display:block}
    .top-ph{width:100%;height:180px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:48px}
    .top-body{padding:16px}
    .top-badge{font-family:monospace;font-size:10px;letter-spacing:2px;color:#fff;background:var(--red);padding:2px 8px;border-radius:2px;display:inline-block;margin-bottom:8px}
    .top-title{font-size:20px;font-weight:600;line-height:1.3;margin-bottom:8px}
    .top-desc{font-size:14px;color:#aaa;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
    .top-meta{font-family:monospace;font-size:11px;color:var(--gold)}
    .news-list{display:flex;flex-direction:column;gap:1px}
    .news-card{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
    .news-card:active{opacity:.7}
    .news-img{width:80px;height:64px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--bg3)}
    .news-ph{width:80px;height:64px;background:var(--bg3);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
    .news-src{font-family:monospace;font-size:10px;letter-spacing:1px;color:var(--gold);margin-bottom:5px;text-transform:uppercase}
    .news-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .news-time{font-size:12px;color:var(--muted);font-family:monospace}
    .sources-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .src-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden}
    .src-card:active{background:var(--bg3)}
    .src-top{position:absolute;top:0;left:0;width:100%;height:3px}
    .src-flag{font-size:22px;margin-bottom:6px}
    .src-name{font-weight:600;font-size:14px;margin-bottom:4px}
    .src-cat{font-size:10px;font-family:monospace;color:var(--muted);letter-spacing:1px}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200}
    .nav-btn{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;font-size:9px;font-family:monospace;letter-spacing:1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
    .nav-btn span:first-child{font-size:19px}
    .nav-btn.active{color:var(--gold2)}
    .ai-box{background:linear-gradient(135deg,rgba(39,174,96,.08),rgba(201,168,76,.05));border:1px solid rgba(39,174,96,.25);border-radius:10px;padding:16px;margin-bottom:20px}
    .ai-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .ai-lbl{font-family:monospace;font-size:10px;letter-spacing:2px;color:var(--green)}
    .ai-btn{background:var(--green);border:none;color:#fff;padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer;font-family:monospace}
    .ai-btn:disabled{opacity:.5;cursor:default}
    .ai-txt{font-size:14px;line-height:1.7;color:#ccc;font-style:italic}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp .35s ease forwards}
  </style>
</head>
<body>
<div class="ticker-wrap"><div class="ticker-inner" id="tk">⏳ Chargement des actualités...</div></div>
<header>
  <div class="header-main">
    <div><div class="logo">ABD SERVICE</div><div class="logo-sub">ACTUALITÉS BÉNIN & MONDE</div></div>
    <div class="date-badge" id="db"></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="switchTab('benin',this)">🇧🇯 BÉNIN</button>
    <button class="tab" onclick="switchTab('afrique',this)">🌍 AFRIQUE</button>
    <button class="tab" onclick="switchTab('monde',this)">🌐 MONDE</button>
    <button class="tab" onclick="switchTab('sport',this)">⚽ SPORT</button>
    <button class="tab" onclick="switchTab('tech',this)">💻 TECH</button>
  </div>
</header>
<main id="main"></main>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-actu" onclick="showPage('actu')"><span>📰</span><span>ACTU</span></button>
  <button class="nav-btn" id="nav-journaux" onclick="showPage('journaux')"><span>📋</span><span>JOURNAUX</span></button>
  <button class="nav-btn" id="nav-ia" onclick="showPage('ia')"><span>✨</span><span>RÉSUMÉ IA</span></button>
</nav>
<script>
const R2J='https://api.rss2json.com/v1/api.json?rss_url=';
const FEEDS={
  benin:['https://www.24haubenin.info/feed/','https://actubenin.com/feed/','https://banouto.info/feed/'],
  afrique:['https://www.jeuneafrique.com/feed/','https://www.rfi.fr/fr/afrique/rss','https://afrik.com/feed'],
  monde:['https://www.france24.com/fr/rss','https://www.rfi.fr/fr/rss'],
  sport:['https://www.rfi.fr/fr/sports/rss','https://www.france24.com/fr/sports/rss'],
  tech:['https://www.01net.com/feed/','https://www.lemondeinformatique.fr/flux-rss/thematique/actualites/rss.xml']
};
const SRCS={
  benin:[
    {name:"La Nation",url:"https://lanationbenin.info",flag:"🇧🇯",cat:"Politique",color:"#27ae60"},
    {name:"Banouto",url:"https://banouto.info",flag:"🇧🇯",cat:"Général",color:"#f39c12"},
    {name:"Matin Libre",url:"https://matinlibre.com",flag:"🇧🇯",cat:"Société",color:"#c0392b"},
    {name:"Actu Bénin",url:"https://actubenin.com",flag:"🇧🇯",cat:"Actualité",color:"#2980b9"},
    {name:"24h au Bénin",url:"https://24haubenin.info",flag:"🇧🇯",cat:"Général",color:"#27ae60"},
    {name:"Fraternité",url:"https://fraternite.bj",flag:"🇧🇯",cat:"Culture",color:"#8e44ad"},
    {name:"L'Évènement Précis",url:"https://evenementprecis.com",flag:"🇧🇯",cat:"Politique",color:"#c0392b"},
    {name:"Bénin Web TV",url:"https://beninwebtv.com",flag:"🇧🇯",cat:"Médias",color:"#f39c12"}
  ],
  afrique:[
    {name:"Jeune Afrique",url:"https://jeuneafrique.com",flag:"🌍",cat:"Politique",color:"#c9a84c"},
    {name:"RFI Afrique",url:"https://rfi.fr/afrique",flag:"🌍",cat:"Radio",color:"#c0392b"},
    {name:"Africa News",url:"https://africanews.com",flag:"🌍",cat:"TV",color:"#2980b9"},
    {name:"BBC Afrique",url:"https://bbc.com/afrique",flag:"🌍",cat:"International",color:"#c0392b"},
    {name:"Le Monde Afrique",url:"https://lemonde.fr/afrique",flag:"🌍",cat:"Société",color:"#555"},
    {name:"TV5 Monde",url:"https://tv5monde.com",flag:"🌍",cat:"TV",color:"#2980b9"}
  ],
  monde:[
    {name:"Le Monde",url:"https://lemonde.fr",flag:"🌐",cat:"Général",color:"#333"},
    {name:"France 24",url:"https://france24.com/fr",flag:"🌐",cat:"TV",color:"#003B7A"},
    {name:"RFI",url:"https://rfi.fr",flag:"🌐",cat:"Radio",color:"#c0392b"},
    {name:"Al Jazeera",url:"https://aljazeera.com/fr",flag:"🌐",cat:"International",color:"#c9a84c"}
  ]
};
const EM={benin:"🇧🇯",afrique:"🌍",monde:"🌐",sport:"⚽",tech:"💻"};
let tab='benin',page='actu',cache={},aiTxt={};

document.getElementById('db').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();

async function fetchNews(t){
  if(cache[t])return cache[t];
  const feeds=FEEDS[t]||[];
  const items=[];
  for(const f of feeds){
    try{
      const r=await fetch(R2J+encodeURIComponent(f)+'&count=10');
      const d=await r.json();
      if(d.items)d.items.forEach(i=>items.push({
        title:i.title||'',
        desc:(i.description||'').replace(/<[^>]*>/g,'').slice(0,150),
        url:i.link||'#',
        img:i.thumbnail||i.enclosure?.link||'',
        src:d.feed?.title||'Source',
        time:i.pubDate?ago(new Date(i.pubDate)):''
      }));
    }catch(e){}
  }
  const seen=new Set();
  const u=items.filter(a=>{if(seen.has(a.title))return false;seen.add(a.title);return true;});
  cache[t]=u;
  if(u.length)document.getElementById('tk').textContent=u.slice(0,6).map(i=>EM[t]+' '+i.title).join('  ◆  ');
  return u;
}

function ago(d){
  const s=(Date.now()-d)/1000;
  if(s<60)return"À l'instant";
  if(s<3600)return`Il y a ${Math.floor(s/60)}min`;
  if(s<86400)return`Il y a ${Math.floor(s/3600)}h`;
  return`Il y a ${Math.floor(s/86400)}j`;
}

function loading(){document.getElementById('main').innerHTML='<div class="loading fu"><div class="spinner"></div><p style="font-family:monospace;font-size:13px;letter-spacing:1px">CHARGEMENT...</p></div>';}

function renderNews(items,t){
  if(!items.length){document.getElementById('main').innerHTML=`<div class="error-box fu"><p>Aucune actualité disponible.<br>Vérifiez votre connexion.</p><button class="retry-btn" onclick="loadNews('${t}')">🔄 Réessayer</button></div>`;return;}
  const top=items[0],rest=items.slice(1,20);
  let h=`<div class="fu">`;
  h+=`<a class="top-story" href="${top.url}" target="_blank" rel="noopener">`;
  h+=top.img?`<img class="top-img" src="${top.img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="top-ph" style="display:none">${EM[t]}</div>`:`<div class="top-ph">${EM[t]}</div>`;
  h+=`<div class="top-body"><span class="top-badge">À LA UNE</span><div class="top-title">${top.title}</div>${top.desc?`<div class="top-desc">${top.desc}</div>`:''}<div class="top-meta">${top.src} · ${top.time}</div></div></a>`;
  h+=`<div class="sec-label">TOUTES LES ACTUALITÉS (${rest.length})</div><div class="news-list">`;
  rest.forEach(i=>{
    h+=`<a class="news-card" href="${i.url}" target="_blank" rel="noopener">`;
    h+=i.img?`<img class="news-img" src="${i.img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="news-ph" style="display:none">${EM[t]}</div>`:`<div class="news-ph">${EM[t]}</div>`;
    h+=`<div class="news-content"><div class="news-src">${i.src}</div><div class="news-title">${i.title}</div><div class="news-time">${i.time}</div></div></a>`;
  });
  h+=`</div></div>`;
  document.getElementById('main').innerHTML=h;
}

function renderJournaux(){
  let h='<div class="fu">';
  [['benin','🇧🇯 Journaux du Bénin'],['afrique','🌍 Médias Africains'],['monde','🌐 Presse Mondiale']].forEach(([t,lbl])=>{
    h+=`<div class="sec-label" style="margin-bottom:14px">${lbl}</div><div class="sources-grid" style="margin-bottom:28px">`;
    (SRCS[t]||[]).forEach(s=>{h+=`<a class="src-card" href="${s.url}" target="_blank" rel="noopener"><div class="src-top" style="background:${s.color}"></div><div class="src-flag">${s.flag}</div><div class="src-name">${s.name}</div><div class="src-cat">${s.cat}</div></a>`;});
    h+=`</div>`;
  });
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}

function renderIA(){
  const items=(cache[tab]||[]).slice(0,5);
  const has=items.length>0;
  document.getElementById('main').innerHTML=`<div class="fu">
    <div class="ai-box">
      <div class="ai-hdr"><span class="ai-lbl">✨ RÉSUMÉ IA — ${tab.toUpperCase()}</span>
      <button class="ai-btn" id="aiBtn" onclick="genAI()" ${!has?'disabled':''}>${aiTxt[tab]?'Actualiser':'Générer'}</button></div>
      <div class="ai-txt" id="aiTxt">${aiTxt[tab]||(has?'<span style="color:#444;font-style:italic">Appuyez sur "Générer" pour un résumé par Claude AI</span>':'<span style="color:#444;font-style:italic">Chargez d\'abord les actualités dans ACTU</span>')}</div>
    </div>
    ${has?`<div class="sec-label">TITRES ANALYSÉS</div><div class="news-list">${items.map(i=>`<a class="news-card" href="${i.url}" target="_blank" rel="noopener"><div class="news-ph">${EM[tab]}</div><div class="news-content"><div class="news-src">${i.src}</div><div class="news-title">${i.title}</div><div class="news-time">${i.time}</div></div></a>`).join('')}</div>`:''}
  </div>`;
}

async function genAI(){
  const btn=document.getElementById('aiBtn'),txt=document.getElementById('aiTxt');
  if(!btn||!txt)return;
  btn.disabled=true;btn.textContent='...';
  txt.innerHTML='<span style="color:#444;font-style:italic">⏳ Claude analyse les actualités...</span>';
  const headlines=(cache[tab]||[]).slice(0,5).map(i=>i.title).join('\n');
  const lbl={benin:'du Bénin',afrique:"d'Afrique",monde:'mondiale',sport:'sportive',tech:'technologique'}[tab];
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:`Voici les titres de l'actualité ${lbl} du jour:\n${headlines}\n\nFais un résumé journalistique en 3-4 phrases en français. Commence par "📰 Résumé du jour :"`}]})});
    const d=await r.json();
    aiTxt[tab]=d.content?.map(c=>c.text||'').join('')||'Résumé indisponible.';
    txt.textContent=aiTxt[tab];
  }catch{txt.textContent='📰 Résumé indisponible. Vérifiez votre connexion.';}
  btn.disabled=false;btn.textContent='Actualiser';
}

function switchTab(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(page==='actu')loadNews(t);
  else if(page==='ia')renderIA();
}

function showPage(p){
  page=p;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+p).classList.add('active');
  document.getElementById('tabs').style.display=(p==='journaux')?'none':'flex';
  if(p==='actu')loadNews(tab);
  else if(p==='journaux')renderJournaux();
  else renderIA();
}

async function loadNews(t){
  loading();
  try{const items=await fetchNews(t);renderNews(items,t);}
  catch{document.getElementById('main').innerHTML=`<div class="error-box fu"><p>Erreur de connexion.</p><button class="retry-btn" onclick="loadNews('${t}')">🔄 Réessayer</button></div>`;}
}

loadNews('benin');
</script>
</body>
</html>
