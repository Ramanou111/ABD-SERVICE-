<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>ABD SERVICE — Actualités Bénin & Monde</title>
  <meta name="theme-color" content="#0f0f0f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="ABD SERVICE"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--gold:#c9a84c;--gold2:#f0d080;--red:#c0392b;--green:#27ae60;--text:#e8e8e8;--muted:#777;--border:rgba(255,255,255,0.07)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;padding-bottom:70px}
    .ticker{background:var(--red);padding:7px 16px;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .hdr{padding:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between}
    .logo{font-family:'Bebas Neue',serif;font-size:38px;color:var(--gold2);letter-spacing:2px;line-height:1}
    .logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;font-family:monospace;margin-top:2px}
    .date{font-family:monospace;font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:4px 10px;border-radius:2px;margin-bottom:4px}
    .tabs{display:flex;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:1;min-width:70px;background:none;border:none;color:var(--muted);padding:11px 6px;font-size:11px;font-family:monospace;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
    .tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
    main{padding:16px;max-width:700px;margin:0 auto}
    .loading{text-align:center;padding:50px 20px;color:var(--muted)}
    .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s}
    .card:active{border-color:var(--gold)}
    .card-badge{font-family:monospace;font-size:10px;letter-spacing:2px;color:#fff;background:var(--red);padding:2px 8px;border-radius:2px;display:inline-block;margin-bottom:8px}
    .card-title{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:8px}
    .card-desc{font-size:13px;color:#999;line-height:1.5;margin-bottom:8px}
    .card-meta{font-family:monospace;font-size:11px;color:var(--gold)}
    .card-sm{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
    .card-sm-num{font-family:monospace;font-size:22px;font-weight:900;color:rgba(201,168,76,.25);min-width:28px;line-height:1}
    .card-sm-title{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:4px}
    .card-sm-meta{font-family:monospace;font-size:11px;color:var(--gold)}
    .sec-lbl{font-family:monospace;font-size:10px;letter-spacing:3px;color:var(--gold);border-bottom:1px solid rgba(201,168,76,.2);padding-bottom:8px;margin-bottom:14px}
    .sources-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .src{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden}
    .src-bar{position:absolute;top:0;left:0;width:100%;height:3px}
    .src-flag{font-size:22px;margin-bottom:6px}
    .src-name{font-weight:600;font-size:14px;margin-bottom:4px}
    .src-cat{font-size:10px;font-family:monospace;color:var(--muted)}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200}
    .nav-btn{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;font-size:9px;font-family:monospace;letter-spacing:1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
    .nav-btn span:first-child{font-size:19px}
    .nav-btn.active{color:var(--gold2)}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .3s ease forwards}
  </style>
</head>
<body>
<div class="ticker" id="tk">📰 ABD SERVICE — Actualités Bénin & Monde</div>
<header>
  <div class="hdr">
    <div><div class="logo">ABD SERVICE</div><div class="logo-sub">ACTUALITÉS BÉNIN & MONDE</div></div>
    <div class="date" id="db"></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="switchTab('benin',this)">🇧🇯 BÉNIN</button>
    <button class="tab" onclick="switchTab('afrique',this)">🌍 AFRIQUE</button>
    <button class="tab" onclick="switchTab('monde',this)">🌐 MONDE</button>
    <button class="tab" onclick="switchTab('sport',this)">⚽ SPORT</button>
    <button class="tab" onclick="switchTab('tech',this)">💻 TECH</button>
  </div>
</header>
<main id="main"></main>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-actu" onclick="showPage('actu')"><span>📰</span><span>ACTU</span></button>
  <button class="nav-btn" id="nav-journaux" onclick="showPage('journaux')"><span>📋</span><span>JOURNAUX</span></button>
  <button class="nav-btn" id="nav-ia" onclick="showPage('ia')"><span>✨</span><span>IA</span></button>
</nav>
<script>
const SRCS={
  benin:[
    {name:"La Nation",url:"https://lanationbenin.info",flag:"🇧🇯",cat:"Politique",color:"#27ae60"},
    {name:"Banouto",url:"https://banouto.info",flag:"🇧🇯",cat:"Général",color:"#f39c12"},
    {name:"Matin Libre",url:"https://matinlibre.com",flag:"🇧🇯",cat:"Société",color:"#c0392b"},
    {name:"Actu Bénin",url:"https://actubenin.com",flag:"🇧🇯",cat:"Actualité",color:"#2980b9"},
    {name:"24h au Bénin",url:"https://24haubenin.info",flag:"🇧🇯",cat:"Général",color:"#27ae60"},
    {name:"Fraternité",url:"https://fraternite.bj",flag:"🇧🇯",cat:"Culture",color:"#8e44ad"},
    {name:"L'Évènement Précis",url:"https://evenementprecis.com",flag:"🇧🇯",cat:"Politique",color:"#c0392b"},
    {name:"Bénin Web TV",url:"https://beninwebtv.com",flag:"🇧🇯",cat:"Médias",color:"#f39c12"}
  ],
  afrique:[
    {name:"Jeune Afrique",url:"https://jeuneafrique.com",flag:"🌍",cat:"Politique",color:"#c9a84c"},
    {name:"RFI Afrique",url:"https://rfi.fr/afrique",flag:"🌍",cat:"Radio",color:"#c0392b"},
    {name:"Africa News",url:"https://africanews.com",flag:"🌍",cat:"TV",color:"#2980b9"},
    {name:"BBC Afrique",url:"https://bbc.com/afrique",flag:"🌍",cat:"International",color:"#c0392b"},
    {name:"Le Monde Afrique",url:"https://lemonde.fr/afrique",flag:"🌍",cat:"Société",color:"#555"},
    {name:"TV5 Monde",url:"https://tv5monde.com",flag:"🌍",cat:"TV",color:"#2980b9"}
  ],
  monde:[
    {name:"Le Monde",url:"https://lemonde.fr",flag:"🌐",cat:"Général",color:"#333"},
    {name:"France 24",url:"https://france24.com/fr",flag:"🌐",cat:"TV",color:"#003B7A"},
    {name:"RFI",url:"https://rfi.fr",flag:"🌐",cat:"Radio",color:"#c0392b"},
    {name:"Al Jazeera",url:"https://aljazeera.com/fr",flag:"🌐",cat:"International",color:"#c9a84c"}
  ]
};

const TOPICS={
  benin:"actualités récentes du Bénin: politique, économie, société, culture à Cotonou, Porto-Novo, Parakou",
  afrique:"actualités récentes d'Afrique de l'Ouest et du continent africain",
  monde:"actualités internationales récentes en Europe, Amérique, Asie, Moyen-Orient",
  sport:"actualités sportives récentes: football africain, CAN, sport béninois et mondial",
  tech:"actualités technologie, intelligence artificielle, numérique en Afrique et dans le monde"
};

const EM={benin:"🇧🇯",afrique:"🌍",monde:"🌐",sport:"⚽",tech:"💻"};
let tab='benin',page='actu',cache={};

document.getElementById('db').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();

async function fetchAI(t){
  if(cache[t])return cache[t];
  const topic=TOPICS[t];
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:2000,
      messages:[{role:'user',content:`Tu es un journaliste africain expert. Génère 8 titres d'actualités réalistes et crédibles sur: ${topic}. Date: mai 2026.

Réponds UNIQUEMENT en JSON valide, sans markdown, sans explication:
[
  {"titre":"...","source":"...","description":"...","categorie":"...","heure":"Il y a Xh"},
  ...
]

Sources possibles: RFI, France 24, Jeune Afrique, BBC Afrique, AFP, La Nation (Bénin), Banouto, Actu Bénin, 24h au Bénin, Reuters.`}]
    })
  });
  const d=await r.json();
  const txt=d.content?.map(c=>c.text||'').join('')||'[]';
  let items=[];
  try{
    const clean=txt.replace(/```json|```/g,'').trim();
    items=JSON.parse(clean);
  }catch(e){items=[];}
  cache[t]=items;
  if(items.length){
    document.getElementById('tk').textContent=items.slice(0,4).map(i=>EM[t]+' '+i.titre).join('  ◆  ');
  }
  return items;
}

function loading(){
  document.getElementById('main').innerHTML=`<div class="loading fu"><div class="spin"></div><p style="font-family:monospace;font-size:12px;letter-spacing:1px;margin-top:8px">CHARGEMENT DES ACTUALITÉS...</p></div>`;
}

function renderNews(items,t){
  if(!items.length){
    document.getElementById('main').innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--muted)"><p style="font-size:15px;margin-bottom:16px">Impossible de charger les actualités.</p><button onclick="loadNews('${t}')" style="background:var(--red);border:none;color:#fff;padding:10px 24px;border-radius:4px;font-size:14px;cursor:pointer;font-family:monospace">🔄 Réessayer</button></div>`;
    return;
  }
  const top=items[0], rest=items.slice(1);
  let h=`<div class="fu">`;
  h+=`<div class="card">
    <span class="card-badge">À LA UNE</span>
    <div class="card-title">${top.titre}</div>
    <div class="card-desc">${top.description||''}</div>
    <div class="card-meta">${top.source} · ${top.heure} · ${top.categorie}</div>
  </div>`;
  h+=`<div class="sec-lbl">TOUTES LES ACTUALITÉS (${rest.length})</div>`;
  rest.forEach((i,idx)=>{
    h+=`<div class="card-sm">
      <div class="card-sm-num">${String(idx+2).padStart(2,'0')}</div>
      <div>
        <div class="card-sm-title">${i.titre}</div>
        <div class="card-sm-meta">${i.source} · ${i.heure}</div>
      </div>
    </div>`;
  });
  h+=`</div>`;
  document.getElementById('main').innerHTML=h;
}

function renderJournaux(){
  let h='<div class="fu">';
  [['benin','🇧🇯 Journaux du Bénin'],['afrique','🌍 Médias Africains'],['monde','🌐 Presse Mondiale']].forEach(([t,lbl])=>{
    h+=`<div class="sec-lbl" style="margin-bottom:14px">${lbl}</div><div class="sources-grid" style="margin-bottom:28px">`;
    (SRCS[t]||[]).forEach(s=>{
      h+=`<a class="src" href="${s.url}" target="_blank" rel="noopener">
        <div class="src-bar" style="background:${s.color}"></div>
        <div class="src-flag">${s.flag}</div>
        <div class="src-name">${s.name}</div>
        <div class="src-cat">${s.cat}</div>
      </a>`;
    });
    h+=`</div>`;
  });
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}

function renderIA(){
  const items=cache[tab]||[];
  const has=items.length>0;
  const summary=has?items.map((i,idx)=>`${idx+1}. ${i.titre}`).join('\n'):'';
  document.getElementById('main').innerHTML=`<div class="fu">
    <div style="background:linear-gradient(135deg,rgba(39,174,96,.08),rgba(201,168,76,.05));border:1px solid rgba(39,174,96,.25);border-radius:10px;padding:16px;margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-family:monospace;font-size:10px;letter-spacing:2px;color:var(--green)">✨ RÉSUMÉ IA — ${tab.toUpperCase()}</span>
        <button id="aiBtn" onclick="genSummary()" ${!has?'disabled':''} style="background:var(--green);border:none;color:#fff;padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer;font-family:monospace">${has?'Générer':'Charger ACTU d\'abord'}</button>
      </div>
      <div id="aiTxt" style="font-size:14px;line-height:1.7;color:#ccc;font-style:italic">
        ${has?'Appuyez sur "Générer" pour un résumé intelligent.':'Allez dans ACTU pour charger les actualités d\'abord.'}
      </div>
    </div>
    ${has?`<div class="sec-lbl">TITRES DU JOUR</div>${items.map((i,idx)=>`<div class="card-sm"><div class="card-sm-num">${String(idx+1).padStart(2,'0')}</div><div><div class="card-sm-title">${i.titre}</div><div class="card-sm-meta">${i.source} · ${i.heure}</div></div></div>`).join('')}`:''}
  </div>`;
}

async function genSummary(){
  const btn=document.getElementById('aiBtn'),txt=document.getElementById('aiTxt');
  if(!btn||!txt)return;
  btn.disabled=true;btn.textContent='...';
  txt.innerHTML='<span style="color:#444">⏳ Claude analyse...</span>';
  const headlines=(cache[tab]||[]).map(i=>i.titre).join('\n');
  const lbl={benin:'du Bénin',afrique:"d'Afrique",monde:'mondiale',sport:'sportive',tech:'technologique'}[tab];
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:`Résume l'actualité ${lbl} du jour en 3 phrases journalistiques en français, à partir de ces titres:\n${headlines}\n\nCommence par "📰 Résumé du jour :"`}]})});
    const d=await r.json();
    txt.textContent=d.content?.map(c=>c.text||'').join('')||'Résumé indisponible.';
  }catch{txt.textContent='Résumé indisponible.';}
  btn.disabled=false;btn.textContent='Actualiser';
}

function switchTab(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(page==='actu')loadNews(t);
  else if(page==='ia')renderIA();
}

function showPage(p){
  page=p;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+p).classList.add('active');
  document.getElementById('tabs').style.display=(p==='journaux')?'none':'flex';
  if(p==='actu')loadNews(tab);
  else if(p==='journaux')renderJournaux();
  else renderIA();
}

async function loadNews(t){
  loading();
  try{const items=await fetchAI(t);renderNews(items,t);}
  catch(e){document.getElementById('main').innerHTML=`<div style="text-align:center;padding:40px 20px"><p style="color:#e74c3c;margin-bottom:16px">Erreur de chargement.</p><button onclick="loadNews('${t}')" style="background:var(--red);border:none;color:#fff;padding:10px 24px;border-radius:4px;cursor:pointer;font-family:monospace">🔄 Réessayer</button></div>`;}
}

loadNews('benin');
</script>
</body>
</html>
