<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>ABD SERVICE — Journaux Bénin & Monde</title>
  <meta name="theme-color" content="#0f0f0f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="ABD SERVICE"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--gold:#c9a84c;--gold2:#f0d080;--red:#c0392b;--green:#27ae60;--text:#e8e8e8;--muted:#666;--border:rgba(255,255,255,0.08)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;padding-bottom:72px}
    .ticker{background:var(--red);padding:8px 16px;font-size:13px;color:#fff;overflow:hidden;white-space:nowrap}
    .ticker-inner{display:inline-block;animation:scroll 35s linear infinite}
    @keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
    header{background:var(--bg);border-bottom:2px solid rgba(201,168,76,0.3);position:sticky;top:0;z-index:100}
    .hdr{padding:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between}
    .logo{font-family:'Bebas Neue',serif;font-size:40px;color:var(--gold2);letter-spacing:3px;line-height:1}
    .logo-sub{font-size:9px;color:var(--muted);letter-spacing:3px;font-family:monospace;margin-top:2px}
    .date{font-family:monospace;font-size:11px;color:var(--gold);border:1px solid rgba(201,168,76,0.5);padding:4px 10px;border-radius:2px;margin-bottom:4px}
    .tabs{display:flex;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:1;min-width:70px;background:none;border:none;color:var(--muted);padding:12px 6px;font-size:11px;font-family:monospace;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
    .tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
    main{padding:16px;max-width:700px;margin:0 auto}
    .hero{background:linear-gradient(135deg,#1a1a1a,#242424);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;text-align:center}
    .hero-emoji{font-size:48px;margin-bottom:8px}
    .hero-title{font-family:'Bebas Neue',serif;font-size:22px;color:var(--gold2);letter-spacing:2px;margin-bottom:6px}
    .hero-desc{font-size:14px;color:var(--muted);line-height:1.5}
    .sec-lbl{font-family:monospace;font-size:10px;letter-spacing:3px;color:var(--gold);border-bottom:1px solid rgba(201,168,76,0.2);padding-bottom:8px;margin-bottom:14px;margin-top:4px}
    .journals{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
    .journal-card{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:border-color .15s}
    .journal-card:active{border-color:var(--gold);background:var(--bg3)}
    .journal-accent{position:absolute;left:0;top:0;width:4px;height:100%}
    .journal-flag{font-size:28px;flex-shrink:0}
    .journal-info{flex:1}
    .journal-name{font-weight:700;font-size:16px;color:var(--text);margin-bottom:3px}
    .journal-cat{font-family:monospace;font-size:10px;letter-spacing:1px}
    .journal-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
    .journal-arrow{font-size:18px;color:var(--gold);flex-shrink:0;opacity:0.6}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200}
    .nav-btn{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;font-size:9px;font-family:monospace;letter-spacing:1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
    .nav-btn span:first-child{font-size:20px}
    .nav-btn.active{color:var(--gold2)}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
    .stat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
    .stat-num{font-family:'Bebas Neue',serif;font-size:30px;line-height:1}
    .stat-lbl{font-family:monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:4px}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .3s ease forwards}
  </style>
</head>
<body>
<div class="ticker">
  <span class="ticker-inner">🇧🇯 La Nation · Banouto · Matin Libre · Actu Bénin · 24h au Bénin · La Nouvelle Tribune · L'Évènement Précis &nbsp;◆&nbsp; 🌍 Jeune Afrique · RFI · BBC Afrique · Africa News &nbsp;◆&nbsp; 🌐 France 24 · Le Monde · Reuters · Al Jazeera &nbsp;◆&nbsp; ABD SERVICE — Votre portail d'information</span>
</div>
<header>
  <div class="hdr">
    <div><div class="logo">ABD SERVICE</div><div class="logo-sub">PORTAIL D'INFORMATION</div></div>
    <div class="date" id="db"></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="switchTab('benin',this)">🇧🇯 BÉNIN</button>
    <button class="tab" onclick="switchTab('afrique',this)">🌍 AFRIQUE</button>
    <button class="tab" onclick="switchTab('monde',this)">🌐 MONDE</button>
    <button class="tab" onclick="switchTab('sport',this)">⚽ SPORT</button>
    <button class="tab" onclick="switchTab('radio',this)">📻 RADIO</button>
  </div>
</header>
<main id="main"></main>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-actu" onclick="showPage('actu')"><span>📰</span><span>JOURNAUX</span></button>
  <button class="nav-btn" id="nav-accueil" onclick="showPage('accueil')"><span>🏠</span><span>ACCUEIL</span></button>
  <button class="nav-btn" id="nav-liens" onclick="showPage('liens')"><span>🔗</span><span>LIENS</span></button>
</nav>
<script>
const DATA = {
  benin: [
    {name:"La Nation",url:"https://lanation.bj",flag:"🇧🇯",cat:"Journal Officiel",color:"#27ae60",desc:"Le quotidien national officiel du Bénin"},
    {name:"Banouto",url:"https://www.banouto.bj",flag:"🇧🇯",cat:"Investigation",color:"#f39c12",desc:"Meilleur média d'investigation au Bénin"},
    {name:"La Nouvelle Tribune",url:"https://lanouvelletribune.info",flag:"🇧🇯",cat:"Actualités",color:"#c0392b",desc:"Informations et analyses du Bénin"},
    {name:"Matin Libre",url:"https://matinlibre.com",flag:"🇧🇯",cat:"Société",color:"#8e44ad",desc:"Société, économie et culture béninoise"},
    {name:"Actu Bénin",url:"https://www.actusdubenin.com",flag:"🇧🇯",cat:"Actualités",color:"#2980b9",desc:"Toute l'actualité du Bénin en temps réel"},
    {name:"24h au Bénin",url:"https://www.24haubenin.info",flag:"🇧🇯",cat:"Général",color:"#27ae60",desc:"Information béninoise 24h/24"},
    {name:"L'Évènement Précis",url:"https://levenementprecis.bj",flag:"🇧🇯",cat:"Politique",color:"#c0392b",desc:"Politique et société béninoise"},
    {name:"Bénin Web TV",url:"https://beninwebtv.bj",flag:"🇧🇯",cat:"Médias",color:"#f39c12",desc:"Télévision en ligne et vidéos du Bénin"},
    {name:"Fraternité",url:"https://www.fraternitebj.info",flag:"🇧🇯",cat:"Culture",color:"#16a085",desc:"Culture, arts et société au Bénin"},
    {name:"aCotonou",url:"https://news.acotonou.com",flag:"🇧🇯",cat:"Actualités",color:"#e67e22",desc:"Toute l'information du Bénin en temps réel"},
    {name:"ORTB",url:"https://www.ortb.bj",flag:"🇧🇯",cat:"TV Nationale",color:"#c0392b",desc:"Radio et télévision nationale du Bénin"},
  ],
  afrique: [
    {name:"Jeune Afrique",url:"https://www.jeuneafrique.com",flag:"🌍",cat:"Politique",color:"#c9a84c",desc:"Le magazine de référence du continent africain"},
    {name:"RFI Afrique",url:"https://www.rfi.fr/fr/afrique",flag:"🌍",cat:"Radio/Web",color:"#c0392b",desc:"Radio France Internationale — Afrique"},
    {name:"Africa News",url:"https://fr.africanews.com",flag:"🌍",cat:"TV",color:"#2980b9",desc:"Chaîne d'information panafricaine"},
    {name:"BBC Afrique",url:"https://www.bbc.com/afrique",flag:"🌍",cat:"International",color:"#bb1919",desc:"BBC en français pour l'Afrique"},
    {name:"Le Monde Afrique",url:"https://www.lemonde.fr/afrique",flag:"🌍",cat:"Société",color:"#555",desc:"L'Afrique vue par Le Monde"},
    {name:"TV5 Monde",url:"https://information.tv5monde.com",flag:"🌍",cat:"TV",color:"#0b72b9",desc:"Information francophone internationale"},
    {name:"VOA Afrique",url:"https://www.voaafrique.com",flag:"🌍",cat:"Radio",color:"#1565c0",desc:"Voice of America — service Afrique"},
    {name:"Afrik.com",url:"https://www.afrik.com",flag:"🌍",cat:"Général",color:"#c9a84c",desc:"Portail d'information panafricain"},
  ],
  monde: [
    {name:"Le Monde",url:"https://www.lemonde.fr",flag:"🌐",cat:"France",color:"#333",desc:"Le grand quotidien français de référence"},
    {name:"France 24",url:"https://www.france24.com/fr",flag:"🌐",cat:"TV",color:"#003B7A",desc:"Chaîne d'information internationale française"},
    {name:"Reuters",url:"https://www.reuters.com",flag:"🌐",cat:"Agence",color:"#ff8000",desc:"La grande agence de presse mondiale"},
    {name:"Al Jazeera",url:"https://www.aljazeera.com/fr",flag:"🌐",cat:"International",color:"#c9a84c",desc:"Chaîne d'information du Qatar en français"},
    {name:"Deutsche Welle",url:"https://www.dw.com/fr",flag:"🌐",cat:"Europe",color:"#006ab3",desc:"Médias internationaux allemands en français"},
    {name:"Le Figaro",url:"https://www.lefigaro.fr",flag:"🌐",cat:"France",color:"#e63946",desc:"Quotidien français de référence"},
    {name:"20 Minutes",url:"https://www.20minutes.fr",flag:"🌐",cat:"France",color:"#e63946",desc:"Actualités françaises gratuites"},
    {name:"AFP",url:"https://www.afp.com/fr",flag:"🌐",cat:"Agence",color:"#c0392b",desc:"Agence France-Presse — dépêches mondiales"},
  ],
  sport: [
    {name:"Foot Mercato",url:"https://www.footmercato.net",flag:"⚽",cat:"Football",color:"#27ae60",desc:"Mercato et actualités football mondial"},
    {name:"RFI Sport",url:"https://www.rfi.fr/fr/sports",flag:"⚽",cat:"Multi-Sports",color:"#c0392b",desc:"Sport africain et international sur RFI"},
    {name:"Africa Top Sports",url:"https://www.africatopsports.com",flag:"⚽",cat:"Sport Africain",color:"#f39c12",desc:"Sport africain — football, basket, athlétisme"},
    {name:"France 24 Sport",url:"https://www.france24.com/fr/sports",flag:"⚽",cat:"Multi-Sports",color:"#003B7A",desc:"Actualités sportives internationales"},
    {name:"Eurosport",url:"https://www.eurosport.fr",flag:"⚽",cat:"Multi-Sports",color:"#e63946",desc:"Toute l'actualité sportive européenne"},
    {name:"L'Équipe",url:"https://www.lequipe.fr",flag:"⚽",cat:"France",color:"#f39c12",desc:"Le quotidien sportif français de référence"},
  ],
  radio: [
    {name:"ORTB Radio",url:"https://www.ortb.bj",flag:"📻",cat:"Bénin",color:"#27ae60",desc:"Radio nationale officielle du Bénin"},
    {name:"RFI",url:"https://www.rfi.fr",flag:"📻",cat:"International",color:"#c0392b",desc:"Radio France Internationale en direct"},
    {name:"Africa N°1",url:"https://www.africanumero1.com",flag:"📻",cat:"Afrique",color:"#c9a84c",desc:"La première radio panafricaine"},
    {name:"BBC Afrique Radio",url:"https://www.bbc.com/afrique",flag:"📻",cat:"International",color:"#bb1919",desc:"BBC Radio en français pour l'Afrique"},
    {name:"VOA Radio",url:"https://www.voaafrique.com",flag:"📻",cat:"International",color:"#1565c0",desc:"Radio Voice of America en français"},
    {name:"France Inter",url:"https://www.radiofrance.fr/franceinter",flag:"📻",cat:"France",color:"#e63946",desc:"La grande radio publique française"},
  ]
};

const LIENS = [
  {icon:"🏛️",name:"Gouvernement du Bénin",url:"https://www.gouv.bj",desc:"Site officiel du gouvernement béninois"},
  {icon:"📰",name:"Journal Officiel du Bénin",url:"https://journalofficiel.gouv.bj",desc:"Publication des actes officiels de la République"},
  {icon:"📊",name:"INSAE Bénin",url:"https://www.insae.bj",desc:"Institut des statistiques du Bénin"},
  {icon:"🌍",name:"Union Africaine",url:"https://au.int/fr",desc:"Portail officiel de l'Union Africaine"},
  {icon:"💰",name:"Banque Mondiale Afrique",url:"https://www.banquemondiale.org/fr/region/afr",desc:"Données économiques africaines"},
  {icon:"🏥",name:"OMS Afrique",url:"https://www.afro.who.int/fr",desc:"Organisation Mondiale de la Santé — Afrique"},
  {icon:"🌐",name:"CEDEAO",url:"https://www.ecowas.int/fr",desc:"Communauté Économique des États de l'Afrique de l'Ouest"},
  {icon:"✈️",name:"Aéroport de Cotonou",url:"https://www.aeroportcotonou.bj",desc:"Informations vols — Aéroport de Cotonou"},
];

let tab='benin', page='actu';

document.getElementById('db').textContent = new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}).toUpperCase();

function switchTab(t, btn) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(page==='actu') renderJournaux();
}

function showPage(p) {
  page = p;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+p).classList.add('active');
  document.getElementById('tabs').style.display = (p==='actu') ? 'flex' : 'none';
  if(p==='actu') renderJournaux();
  else if(p==='accueil') renderAccueil();
  else renderLiens();
}

function renderJournaux() {
  const items = DATA[tab] || [];
  const labels = {benin:'🇧🇯 JOURNAUX DU BÉNIN',afrique:'🌍 MÉDIAS AFRICAINS',monde:'🌐 PRESSE MONDIALE',sport:'⚽ MÉDIAS SPORTIFS',radio:'📻 RADIOS'};
  let h = `<div class="fu"><div class="sec-lbl">${labels[tab]} — ${items.length} SOURCES</div><div class="journals">`;
  items.forEach(j => {
    h += `<a class="journal-card" href="${j.url}" target="_blank" rel="noopener">
      <div class="journal-accent" style="background:${j.color}"></div>
      <div class="journal-flag">${j.flag}</div>
      <div class="journal-info">
        <div class="journal-name">${j.name}</div>
        <div class="journal-cat" style="color:${j.color}">${j.cat}</div>
        <div class="journal-desc">${j.desc}</div>
      </div>
      <div class="journal-arrow">→</div>
    </a>`;
  });
  h += `</div></div>`;
  document.getElementById('main').innerHTML = h;
}

function renderAccueil() {
  document.getElementById('main').innerHTML = `<div class="fu">
    <div class="hero">
      <div class="hero-emoji">📰</div>
      <div class="hero-title">ABD SERVICE</div>
      <div class="hero-desc">Votre portail d'information complet — Bénin, Afrique et Monde en un seul endroit</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num" style="color:#27ae60">${DATA.benin.length}</div><div class="stat-lbl">BÉNIN</div></div>
      <div class="stat"><div class="stat-num" style="color:#c9a84c">${DATA.afrique.length+DATA.monde.length}</div><div class="stat-lbl">MONDE</div></div>
      <div class="stat"><div class="stat-num" style="color:#c0392b">${DATA.sport.length+DATA.radio.length}</div><div class="stat-lbl">SPORT/RADIO</div></div>
    </div>
    <div class="sec-lbl">COMMENT UTILISER</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px">
      <p style="font-size:15px;line-height:1.8;color:#ccc">
        📰 <strong style="color:var(--gold2)">JOURNAUX</strong> — Tous les médias par catégorie<br>
        🏠 <strong style="color:var(--gold2)">ACCUEIL</strong> — Cette page d'accueil<br>
        🔗 <strong style="color:var(--gold2)">LIENS</strong> — Sites officiels et utiles<br><br>
        Appuyez sur un journal pour l'ouvrir directement.
      </p>
    </div>
    <div class="sec-lbl">PARTAGER L'APPLICATION</div>
    <div style="background:var(--bg2);border:1px solid rgba(39,174,96,.3);border-radius:10px;padding:16px">
      <p style="font-size:14px;color:#aaa;margin-bottom:10px">Envoyez ce lien à vos amis :</p>
      <div style="font-family:monospace;font-size:12px;color:var(--green);background:var(--bg3);padding:10px;border-radius:6px;word-break:break-all">https://ramanou111.github.io/ABD-SERVICE-</div>
    </div>
  </div>`;
}

function renderLiens() {
  let h = `<div class="fu"><div class="sec-lbl">LIENS UTILES — BÉNIN & MONDE</div><div class="journals">`;
  LIENS.forEach(l => {
    h += `<a class="journal-card" href="${l.url}" target="_blank" rel="noopener">
      <div class="journal-accent" style="background:var(--gold)"></div>
      <div class="journal-flag">${l.icon}</div>
      <div class="journal-info">
        <div class="journal-name">${l.name}</div>
        <div class="journal-desc">${l.desc}</div>
      </div>
      <div class="journal-arrow">→</div>
    </a>`;
  });
  h += `</div></div>`;
  document.getElementById('main').innerHTML = h;
}

renderJournaux();
</script>
</body>
</html>
