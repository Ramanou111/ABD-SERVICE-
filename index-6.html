  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--gold:#c9a84c;--gold2:#f0d080;--red:#c0392b;--green:#27ae60;--text:#e8e8e8;--muted:#666;--border:rgba(255,255,255,0.08)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;padding-bottom:72px}
    .ticker{background:var(--red);padding:8px 16px;font-size:13px;color:#fff;overflow:hidden;white-space:nowrap}
    .ticker-inner{display:inline-block;animation:scroll 40s linear infinite}
    @keyframes scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
    header{background:var(--bg);border-bottom:2px solid rgba(201,168,76,0.3);position:sticky;top:0;z-index:100}
    .hdr{padding:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between}
    .logo{font-family:'Bebas Neue',serif;font-size:40px;color:var(--gold2);letter-spacing:3px;line-height:1}
    .logo-sub{font-size:9px;color:var(--muted);letter-spacing:3px;font-family:monospace;margin-top:2px}
    .date{font-family:monospace;font-size:11px;color:var(--gold);border:1px solid rgba(201,168,76,0.5);padding:4px 10px;border-radius:2px;margin-bottom:4px}
    .tabs{display:flex;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:1;min-width:70px;background:none;border:none;color:var(--muted);padding:12px 6px;font-size:11px;font-family:monospace;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
    .tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
    main{padding:16px;max-width:700px;margin:0 auto}
    /* ACTUALITÉS */
    .actu-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .actu-lbl{font-family:monospace;font-size:10px;letter-spacing:3px;color:var(--gold)}
    .refresh-btn{background:none;border:1px solid rgba(201,168,76,0.4);color:var(--gold);padding:6px 14px;border-radius:4px;font-size:11px;font-family:monospace;cursor:pointer}
    .news-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
    .news-item:active{opacity:0.7}
    .news-num{font-family:monospace;font-size:18px;font-weight:900;color:rgba(201,168,76,0.2);min-width:28px;flex-shrink:0;padding-top:2px}
    .news-body{flex:1}
    .news-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:4px}
    .news-desc{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .news-meta{font-family:monospace;font-size:11px;color:var(--gold)}
    .news-img{width:72px;height:56px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--bg3)}
    .loading{text-align:center;padding:40px 20px;color:var(--muted)}
    .spin{width:30px;height:30px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* JOURNAUX */
    .sec-lbl{font-family:monospace;font-size:10px;letter-spacing:3px;color:var(--gold);border-bottom:1px solid rgba(201,168,76,0.2);padding-bottom:8px;margin-bottom:14px}
    .journals{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
    .jcard{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;text-decoration:none;color:inherit;position:relative;overflow:hidden}
    .jcard:active{border-color:var(--gold)}
    .jcard-bar{position:absolute;left:0;top:0;width:4px;height:100%}
    .jcard-flag{font-size:28px;flex-shrink:0}
    .jcard-info{flex:1}
    .jcard-name{font-weight:700;font-size:16px;margin-bottom:3px}
    .jcard-cat{font-family:monospace;font-size:10px;letter-spacing:1px}
    .jcard-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
    .jcard-arrow{font-size:18px;color:var(--gold);flex-shrink:0;opacity:0.6}
    /* NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200}
    .nav-btn{flex:1;background:none;border:none;color:var(--muted);padding:10px 4px 8px;font-size:9px;font-family:monospace;letter-spacing:1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
    .nav-btn span:first-child{font-size:20px}
    .nav-btn.active{color:var(--gold2)}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
    .stat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
    .stat-num{font-family:'Bebas Neue',serif;font-size:30px;line-height:1}
    .stat-lbl{font-family:monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:4px}
    @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fu .3s ease forwards}
  </style>
</head>

const EM={benin:"🇧🇯",afrique:"🌍",monde:"🌐",sport:"⚽",tech:"💻"};
let tab='benin', page='actu', cache={};

document.getElementById('db').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();

// ─── FETCH ACTUALITÉS ─────────────────────────────────────────
async function fetchNews(t) {
  if(cache[t]) return cache[t];
  try {
    const r = await fetch(QUERIES[t]);
    const d = await r.json();
    if(d.results && d.results.length > 0) {
      const items = d.results.map(a => ({
        title: a.title || '',
        desc: (a.description || '').slice(0, 130),
        url: a.link || '#',
        img: a.image_url || '',
        src: a.source_name || 'Source',
        time: a.pubDate ? ago(new Date(a.pubDate)) : ''
      })).filter(a => a.title);
      cache[t] = items;
      // Ticker
      document.getElementById('tk').textContent = items.slice(0,5).map(i=>EM[t]+' '+i.title).join('  ◆  ');
      return items;
    }
    return [];
  } catch(e) { return []; }
}

function ago(d) {
  const s = (Date.now()-d)/1000;
  if(s<60) return "À l'instant";
  if(s<3600) return `Il y a ${Math.floor(s/60)}min`;
  if(s<86400) return `Il y a ${Math.floor(s/3600)}h`;
  return `Il y a ${Math.floor(s/86400)}j`;
}

// ─── RENDER ───────────────────────────────────────────────────
function renderActu() {
  const LABELS = {benin:'🇧🇯 BÉNIN',afrique:'🌍 AFRIQUE',monde:'🌐 MONDE',sport:'⚽ SPORT',tech:'💻 TECH'};
  document.getElementById('main').innerHTML = `<div class="fu">
    <div class="actu-bar">
      <span class="actu-lbl">⚡ ACTUALITÉS — ${LABELS[tab]}</span>
      <button class="refresh-btn" onclick="reload()">🔄 Actualiser</button>
    </div>
    <div id="actus"><div class="loading"><div class="spin"></div>Chargement...</div></div>
  </div>`;
  loadActus();
}

async function loadActus() {
  const items = await fetchNews(tab);
  const el = document.getElementById('actus');
  if(!el) return;
  if(!items.length) {
    el.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted)">
      <p style="margin-bottom:16px;color:#e74c3c">Actualités indisponibles pour le moment.</p>
      <p style="margin-bottom:12px;font-size:13px">Consultez directement :</p>
      ${(JOURNAUX[tab]||[]).slice(0,3).map(j=>`
        <a href="${j.url}" target="_blank" style="display:block;color:var(--gold);margin:8px 0;font-family:monospace;font-size:13px">→ ${j.name}</a>
      `).join('')}
    </div>`;
    return;
  }
  el.innerHTML = items.map((item,i) => `
    <a class="news-item" href="${item.url}" target="_blank" rel="noopener">
      <div class="news-num">${String(i+1).padStart(2,'0')}</div>
      <div class="news-body">
        <div class="news-title">${item.title}</div>
        ${item.desc ? `<div class="news-desc">${item.desc}</div>` : ''}
        <div class="news-meta">${item.src} · ${item.time}</div>
      </div>
      ${item.img ? `<img class="news-img" src="${item.img}" onerror="this.style.display='none'" alt="">` : ''}
    </a>`).join('');
}

function reload() { delete cache[tab]; renderActu(); }

function renderJournaux() {
  const labels = {benin:'🇧🇯 JOURNAUX DU BÉNIN',afrique:'🌍 MÉDIAS AFRICAINS',monde:'🌐 PRESSE MONDIALE',sport:'⚽ SPORT',tech:'💻 TECH'};
  const items = JOURNAUX[tab] || [];
  let h = `<div class="fu"><div class="sec-lbl">${labels[tab]} — ${items.length} SOURCES</div><div class="journals">`;
  items.forEach(j => {
    h += `<a class="jcard" href="${j.url}" target="_blank" rel="noopener">
      <div class="jcard-bar" style="background:${j.color}"></div>
      <div class="jcard-flag">${j.flag}</div>
      <div class="jcard-info">
        <div class="jcard-name">${j.name}</div>
        <div class="jcard-cat" style="color:${j.color}">${j.cat}</div>
        <div class="jcard-desc">${j.desc}</div>
      </div>
      <div class="jcard-arrow">→</div>
    </a>`;
  });
  h += `</div></div>`;
  document.getElementById('main').innerHTML = h;
}

function renderLiens() {

      <div class="jcard-bar" style="background:var(--gold)"></div>
      <div class="jcard-flag">${l.icon}</div>
      <div class="jcard-info">
        <div class="jcard-name">${l.name}</div>
        <div class="jcard-desc">${l.desc}</div>
      </div>
      <div class="jcard-arrow">→</div>
    </a>`;
  });
  h += `</div></div>`;
  document.getElementById('main').innerHTML = h;
}

function switchTab(t, btn) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(page==='actu') renderActu();
  else if(page==='journaux') renderJournaux();
}

function showPage(p) {
  page = p;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+p).classList.add('active');
  const showTabs = (p==='actu'||p==='journaux');
  document.getElementById('tabs').style.display = showTabs ? 'flex' : 'none';
  if(p==='actu') renderActu();
  else if(p==='journaux') renderJournaux();
  else if(p==='accueil') renderAccueil();
  else renderLiens();
}

renderActu();
</script>
</body>
</html>
